name: Security

on:
   push:
      branches: [main, dev]
   pull_request:
      branches: [main, dev]
   schedule:
      # Weekly: new advisories are published without any change to our code.
      - cron: "23 4 * * 1"

permissions:
   contents: read

jobs:
   dependency-audit:
      name: npm audit (production)
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false

         - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
           with:
              node-version: 22

         - name: Audit production dependencies
           run: npm audit --package-lock-only --omit=dev --audit-level=high

   dependency-review:
      name: Dependency review
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false

         # Fails the PR when it introduces a dependency with a high or critical
         # advisory. It only inspects what the PR changes; the audit job above
         # covers the dependencies already in the lockfile.
         - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
           with:
              fail-on-severity: high
              fail-on-scopes: runtime
