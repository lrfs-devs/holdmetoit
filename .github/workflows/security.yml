name: Security

on:
   push:
      branches: [main, dev]
   pull_request:
      branches: [main, dev]
   schedule:
      # Weekly: new advisories are published without any change to our code.
      - cron: "23 4 * * 1"

permissions:
   contents: read

jobs:
   dependency-audit:
      name: npm audit (production)
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
           with:
              persist-credentials: false

         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
           with:
              node-version: 22

         - name: Audit production dependencies
           run: npm audit --package-lock-only --omit=dev --audit-level=high

   dependency-review:
      name: Dependency review
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
           with:
              persist-credentials: false

         # Fails the PR when it introduces a dependency with a high or critical
         # advisory. It only inspects what the PR changes; the audit job above
         # covers the dependencies already in the lockfile.
         - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
           with:
              fail-on-severity: high
              fail-on-scopes: runtime
